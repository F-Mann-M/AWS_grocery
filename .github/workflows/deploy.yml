name: Deploy Grocerymate to AWS

on:
  push:
    branches:
      - version2

permissions:
  id-token: write 
  contents: read 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Clone the repository to the GitHub runner
    - name: Checkout Code 
      uses: actions/checkout@v4

    # Prove to AWS who you are using GitHub Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }} 
        aws-region: eu-central-1
    
    # Check the AWS identity to confirm that the OIDC authentication is working correctly
    - name: Confirm OIDC authentication
      run: aws sts get-caller-identity 
    
    # Log in to the ECR repository
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Build the Docker image and push it to AWS ECR
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: grocerymate-app
        IMAGE_TAG: latest
      run: |
        cd backend
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    # Get the public IP of the GitHub Runner
    - name: Get GitHub Runner IP
      id: ip
      run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

    # Whitelist the IP in the AWS Security Group
    - name: Whitelist Runner IP in Security Group
      env:
        SG_ID: ${{ secrets.EC2_SG_ID }}
        RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
      run: |
        echo "Adding $RUNNER_IP to Security Group $SG_ID..."
        aws ec2 authorize-security-group-ingress \
          --group-id $SG_ID \
          --protocol tcp \
          --port 22 \
          --cidr $RUNNER_IP/32

    # Connect to the EC2 instance
    - name: Copy Database Migration File to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "backend/app/sqlite_dump_clean.sql" 
        target: "/home/ec2-user/"

    # Connect to EC2 install postgresql, migrate DB, and run Docker
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      env:
        # Pass GitHub variables securely into the SSH session
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: grocerymate-app
        IMAGE_TAG: latest
        # get the secrets from GitHub and pass them as environment variables to the EC2 instance
        JWT_SECRET: ${{ secrets.JWT_SECRET_KEY }}
        PG_USER: ${{ secrets.POSTGRES_USER }}
        PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
        PG_DB: ${{ secrets.POSTGRES_DB }}
        PG_HOST: ${{ secrets.POSTGRES_HOST }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        # make the variables above available inside the EC2 terminal
        envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,JWT_SECRET,PG_USER,PG_PASS,PG_DB,PG_HOST
        script: |
          set -e -o pipefail # exit immediately if any command in the pipeline fails
                    
          echo "Running Database Migrations..."
          PGPASSWORD=$PG_PASS psql -h $PG_HOST -U $PG_USER -d $PG_DB -f backend/app/sqlite_dump_clean.sql
          
          echo "Pulling fresh Docker Image..."
          sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "Stopping and removing old container..."
          sudo docker stop grocerymate-app || true
          sudo docker rm grocerymate-app || true
          
          echo "Starting new container with Secrets..."
          sudo docker run -d \
            --name grocerymate-app \
            -p 5000:5000 \
            -e JWT_SECRET_KEY=$JWT_SECRET \
            -e POSTGRES_USER=$PG_USER \
            -e POSTGRES_PASSWORD=$PG_PASS \
            -e POSTGRES_DB=$PG_DB \
            -e POSTGRES_HOST=$PG_HOST \
            -e POSTGRES_URI="postgresql://$PG_USER:$PG_PASS@$PG_HOST:5432/$PG_DB" \
            -e S3_BUCKET_NAME=grocerymate-avatars-24111983 \
            -e S3_REGION=eu-central-1 \
            -e USE_S3_STORAGE=true \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "Deployment finished!"

        
    # clean up the security group rule to remove the GitHub Runner IP after deployment for security hardening
    - name: Revoke Runner IP from Security Group
      if: always()
      env:
        SG_ID: ${{ secrets.EC2_SG_ID }}
        RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
      run: |
        echo "Removing $RUNNER_IP from Security Group $SG_ID..."
        aws ec2 revoke-security-group-ingress \
          --group-id $SG_ID \
          --protocol tcp \
          --port 22 \
          --cidr $RUNNER_IP/32 || true 

